<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Formulário</title>

    <style>
        .container-newletter {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
            border-radius: 8px;
        }

        h1, h2 {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .campo-input, .campo-textarea {
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 4px;
            font-size: 1em;
            width: 100%;
        }

        .btn-Subescrever {
            padding: 10px 15px;
            background-color: #000000;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s;
        }

        .btn-Subescrever:hover {
            background-color: #c50909;
        }
    </style>
</head>

<body>
    <h1>Exemplo de Formulário com Flexbox</h1>

    <div class="container-newletter">
        <h2>Subscreva a nossa Newsletter</h2>

        <form class="form-newletter">
            <input type="text" class="campo-input" placeholder="Nome completo" required>
            <input type="email" class="campo-input" placeholder="Insira o seu email..." required>
            <input type="tel" class="campo-input" placeholder="Telefone / Telemóvel" required>
            <textarea class="campo-textarea" rows="4" placeholder="Escreva a sua mensagem..." required></textarea>
            <button type="submit" class="btn-Subescrever">Subescrever</button>
        </form>
    </div>
</body>
</html>
